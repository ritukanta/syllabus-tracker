<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syllabus Progress Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23FFF3B0'/><stop offset='50%' stop-color='%23FFD700'/><stop offset='100%' stop-color='%23B8860B'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='%230b0b0f' stroke='url(%23g)' stroke-width='6'/><text y='72' font-size='64' font-family='Georgia, serif' font-weight='bold' fill='url(%23g)' x='50' text-anchor='middle'>S</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Royal Enigma";
        src: local("Royal Enigma"), local("Cinzel Decorative Bold"), local("Cinzel Bold");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        --bg-color: #09090d;
        --bg-radial: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.09) 0%, rgba(184, 134, 11, 0.03) 35%, transparent 70%);
        --surface-color: #12121a;
        --surface-elevated: #181824;
        --surface-border: rgba(212, 175, 55, 0.24);
        --surface-border-strong: rgba(255, 215, 0, 0.55);
        --text-primary: #fdfbf7;
        --text-secondary: #c8b88a;
        --text-muted: #8e805e;
        --gold-primary: #ffd700;
        --gold-bright: #fff1a8;
        --gold-metallic: #d4af37;
        --gold-deep: #996515;
        --gold-gradient: linear-gradient(135deg, #fff3b0 0%, #ffd700 35%, #d4af37 70%, #996515 100%);
        --gold-text-gradient: linear-gradient(180deg, #fff8d6 0%, #ffd700 50%, #c59b27 100%);
        --gold-glow: rgba(255, 215, 0, 0.48);
        --gold-soft-glow: rgba(212, 175, 55, 0.22);
        --header-bg: rgba(9, 9, 13, 0.88);
        --card-hover: #191926;
        --card-completed-bg: linear-gradient(145deg, rgba(255, 215, 0, 0.11) 0%, rgba(18, 18, 26, 0.96) 65%);
        --shimmer-color: rgba(255, 241, 168, 0.22);
      }

      [data-theme="light"] {
        --bg-color: #faf7f0;
        --bg-radial: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.16) 0%, rgba(212, 175, 55, 0.04) 40%, transparent 75%);
        --surface-color: #ffffff;
        --surface-elevated: #fffdf7;
        --surface-border: rgba(184, 134, 11, 0.28);
        --surface-border-strong: rgba(184, 134, 11, 0.7);
        --text-primary: #1c1608;
        --text-secondary: #6e551c;
        --text-muted: #947a3b;
        --gold-primary: #c59300;
        --gold-bright: #ffd700;
        --gold-metallic: #b8860b;
        --gold-deep: #7a5805;
        --gold-gradient: linear-gradient(135deg, #ffe680 0%, #d4af37 45%, #b8860b 85%, #8a6200 100%);
        --gold-text-gradient: linear-gradient(180deg, #b8860b 0%, #996515 60%, #6b4700 100%);
        --gold-glow: rgba(212, 175, 55, 0.42);
        --gold-soft-glow: rgba(184, 134, 11, 0.18);
        --header-bg: rgba(250, 247, 240, 0.92);
        --card-hover: #fff9eb;
        --card-completed-bg: linear-gradient(145deg, rgba(255, 215, 0, 0.18) 0%, rgba(255, 255, 255, 0.98) 70%);
        --shimmer-color: rgba(212, 175, 55, 0.25);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Calibri", "Carlito", "Segoe UI", "Arial", sans-serif;
      }

      body {
        background-color: var(--bg-color);
        background-image: var(--bg-radial);
        background-attachment: fixed;
        color: var(--text-primary);
        overflow-x: hidden;
        min-height: 100vh;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      /* Intro Splash Screen Animation (2.4 seconds) */
      #introOverlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at center, #17140a 0%, #07070a 75%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        pointer-events: all;
        animation: introFadeOut 0.55s cubic-bezier(0.4, 0, 0.2, 1) 2.1s forwards;
      }

      .intro-crest {
        width: 86px;
        height: 86px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.18), rgba(184, 134, 11, 0.05));
        border: 2px solid #d4af37;
        box-shadow:
          0 0 30px rgba(255, 215, 0, 0.45),
          inset 0 0 20px rgba(255, 215, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        position: relative;
        overflow: hidden;
        animation: crestPulse 1.8s ease-in-out infinite alternate, introScaleIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .intro-crest::after {
        content: "";
        position: absolute;
        top: -50%;
        left: -120%;
        width: 80%;
        height: 200%;
        background: linear-gradient(90deg, transparent, rgba(255, 248, 214, 0.65), transparent);
        transform: rotate(25deg);
        animation: introSweep 1.6s ease-in-out 0.25s forwards;
      }

      .intro-crest span {
        font-family: "Royal Enigma", "Cinzel Decorative", "Cinzel", Georgia, serif;
        font-size: 2.8rem;
        font-weight: 900;
        background: linear-gradient(180deg, #fff8d6 0%, #ffd700 55%, #b8860b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
      }

      .intro-title {
        font-family: "Royal Enigma", "Cinzel Decorative", "Cinzel", Georgia, serif;
        font-size: clamp(1.6rem, 4vw, 2.7rem);
        font-weight: 800;
        text-align: center;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #c59b27 0%, #fff3b0 30%, #ffd700 50%, #fff3b0 70%, #b8860b 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.6rem;
        opacity: 0;
        animation:
          introTextReveal 0.7s ease 0.2s forwards,
          goldTextShine 2.4s linear infinite;
      }

      .intro-subtitle {
        color: #c8b88a;
        font-size: 0.95rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 1.8rem;
        opacity: 0;
        animation: introTextReveal 0.7s ease 0.4s forwards;
      }

      .intro-progress-track {
        width: min(280px, 75vw);
        height: 4px;
        background: rgba(212, 175, 55, 0.18);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
      }

      .intro-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #b8860b, #ffd700, #fff8d6, #ffd700);
        border-radius: 999px;
        box-shadow: 0 0 15px #ffd700;
        animation: introBarFill 1.95s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }

      @keyframes introScaleIn {
        from {
          opacity: 0;
          transform: scale(0.75) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      @keyframes introTextReveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes introSweep {
        to {
          left: 160%;
        }
      }

      @keyframes introBarFill {
        0% {
          width: 0%;
        }
        100% {
          width: 100%;
        }
      }

      @keyframes introFadeOut {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      @keyframes crestPulse {
        from {
          box-shadow: 0 0 22px rgba(255, 215, 0, 0.35), inset 0 0 14px rgba(255, 215, 0, 0.2);
        }
        to {
          box-shadow: 0 0 38px rgba(255, 215, 0, 0.65), inset 0 0 24px rgba(255, 215, 0, 0.35);
        }
      }

      @keyframes goldTextShine {
        to {
          background-position: 200% center;
        }
      }

      /* Header */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background-color: var(--header-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--surface-border);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25);
        padding: 0.9rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        cursor: pointer;
        user-select: none;
      }

      .brand-emblem {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--gold-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #09090d;
        font-family: "Royal Enigma", "Cinzel Decorative", "Cinzel", Georgia, serif;
        font-weight: 900;
        font-size: 1.35rem;
        box-shadow: 0 0 15px var(--gold-glow);
        flex-shrink: 0;
      }

      .brand h1 {
        font-family: "Royal Enigma", "Cinzel Decorative", "Cinzel", Georgia, serif;
        font-size: 1.45rem;
        font-weight: 800;
        background: var(--gold-text-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 8px var(--gold-soft-glow));
        letter-spacing: 1px;
      }

      .controls {
        display: flex;
        gap: 0.9rem;
        align-items: center;
        position: relative;
      }

      button {
        cursor: pointer;
        border: none;
        outline: none;
        border-radius: 10px;
        padding: 0.6rem 1.25rem;
        font-weight: bold;
        font-size: 0.92rem;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.22s ease,
          box-shadow 0.25s ease,
          border-color 0.25s ease,
          background-color 0.25s ease,
          color 0.25s ease;
      }

      .btn-auth {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(212, 175, 55, 0.04));
        color: var(--gold-primary);
        border: 1px solid var(--gold-metallic);
        box-shadow: 0 0 10px var(--gold-soft-glow);
        letter-spacing: 0.4px;
      }

      .btn-auth::before,
      .btn-back::before,
      .tab-btn::before,
      .section-card::before,
      .chapter-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -110%;
        width: 65%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--shimmer-color),
          transparent
        );
        transform: skewX(-22deg);
        transition: left 0.55s ease;
        pointer-events: none;
      }

      .btn-auth:hover::before,
      .btn-back:hover::before,
      .tab-btn:hover::before,
      .section-card:hover::before,
      .chapter-card:hover::before {
        left: 135%;
      }

      .btn-auth:hover {
        background: var(--gold-gradient);
        color: #09090d;
        border-color: var(--gold-bright);
        box-shadow: 0 0 20px var(--gold-glow);
        transform: translateY(-1px);
      }

      .btn-theme {
        background-color: var(--surface-color);
        color: var(--gold-primary);
        border: 1px solid var(--surface-border);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        padding: 0;
        border-radius: 50%;
        box-shadow: 0 0 8px var(--gold-soft-glow);
      }

      .btn-theme:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 18px var(--gold-glow);
        transform: rotate(12deg) scale(1.05);
      }

      /* Sub-navigation / Back Bar & Subject Tabs */
      .section-nav-bar {
        width: 100%;
        background-color: var(--surface-color);
        border-bottom: 1px solid var(--surface-border);
        padding: 0.75rem 2rem;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .nav-left {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.48rem 1rem;
        font-size: 0.9rem;
        font-weight: 700;
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.14), rgba(212, 175, 55, 0.05));
        color: var(--gold-primary);
        border: 1px solid var(--gold-metallic);
        box-shadow: 0 0 10px var(--gold-soft-glow);
      }

      .btn-back:hover {
        background: var(--gold-gradient);
        color: #09090d;
        border-color: var(--gold-bright);
        box-shadow: 0 0 18px var(--gold-glow);
        transform: translateX(-2px);
      }

      .active-section-crumb {
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .active-section-crumb span.crumb-sep {
        color: var(--gold-metallic);
      }

      .tabs-wrapper {
        width: 100%;
        background-color: var(--surface-elevated);
        border-bottom: 1px solid var(--surface-border);
        padding: 0 2rem;
        display: none;
      }

      .tabs-container {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        gap: 0.75rem;
        padding: 0.75rem 0;
      }

      .tabs-container::-webkit-scrollbar {
        display: none;
      }

      .tab-btn {
        background: var(--surface-color);
        color: var(--text-secondary);
        white-space: nowrap;
        padding: 0.68rem 1.35rem;
        border-radius: 9px;
        font-size: 0.98rem;
        border: 1px solid var(--surface-border);
      }

      .tab-btn:hover {
        color: var(--gold-primary);
        background-color: var(--card-hover);
        border-color: var(--gold-metallic);
        box-shadow: 0 0 14px var(--gold-soft-glow);
        transform: translateY(-1px);
      }

      .tab-btn.active {
        color: #09090d;
        background: var(--gold-gradient);
        border: 1px solid var(--gold-bright);
        box-shadow: 0 0 18px var(--gold-glow);
        font-weight: 800;
      }

      /* Main Container */
      main {
        padding: 2.2rem 2rem 3.5rem;
        max-width: 1400px;
        margin: 0 auto;
        min-height: 75vh;
      }

      /* Home View: 5 Distinct Sections */
      #homeSectionsView {
        display: block;
      }

      .home-hero {
        text-align: center;
        margin-bottom: 2.4rem;
        animation: fadeInDown 0.45s ease forwards;
      }

      .home-hero-title {
        font-family: "Royal Enigma", "Cinzel Decorative", "Cinzel", Georgia, serif;
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 900;
        background: var(--gold-text-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 14px var(--gold-soft-glow));
        letter-spacing: 1.5px;
        margin-bottom: 0.5rem;
      }

      .home-hero-sub {
        color: var(--text-secondary);
        font-size: 1.05rem;
        letter-spacing: 0.6px;
      }

      .sections-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        gap: 1.75rem;
      }

      .section-card {
        background: linear-gradient(155deg, var(--surface-elevated) 0%, var(--surface-color) 100%);
        border: 1px solid var(--surface-border);
        border-radius: 16px;
        padding: 1.85rem;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 1.35rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        transition:
          transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          border-color 0.28s ease,
          box-shadow 0.28s ease;
        animation: fadeInUp 0.45s ease forwards;
        opacity: 0;
      }

      .section-card:hover {
        border-color: var(--gold-primary);
        box-shadow:
          0 12px 30px rgba(0, 0, 0, 0.35),
          0 0 24px var(--gold-glow);
        transform: translateY(-5px);
      }

      .section-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .section-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.32rem 0.75rem;
        border-radius: 999px;
        background: rgba(255, 215, 0, 0.12);
        border: 1px solid var(--gold-metallic);
        color: var(--gold-primary);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .section-icon-box {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(184, 134, 11, 0.05));
        border: 1px solid var(--gold-metallic);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold-primary);
        box-shadow: 0 0 14px var(--gold-soft-glow);
        flex-shrink: 0;
      }

      .section-card-title {
        font-family: "Royal Enigma", "Cinzel Decorative", "Cinzel", Georgia, serif;
        font-size: 1.55rem;
        font-weight: 800;
        background: var(--gold-text-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.3;
        margin-top: 0.65rem;
      }

      .section-subjects-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      .subject-pill {
        font-size: 0.84rem;
        padding: 0.28rem 0.7rem;
        border-radius: 6px;
        background: rgba(212, 175, 55, 0.1);
        border: 1px solid var(--surface-border);
        color: var(--text-secondary);
        font-weight: 600;
      }

      .section-card-footer {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--surface-border);
      }

      .section-stats-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        color: var(--text-secondary);
        font-weight: 700;
      }

      .section-open-cta {
        color: var(--gold-primary);
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-weight: 800;
      }

      .progress-track {
        width: 100%;
        height: 6px;
        background: rgba(212, 175, 55, 0.14);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--gold-gradient);
        border-radius: 999px;
        box-shadow: 0 0 10px var(--gold-glow);
        transition: width 0.35s ease;
      }

      /* Section Details / Subject Chapters View */
      #subjectChaptersView {
        display: none;
      }

      .subject-header-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.8rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--surface-border);
      }

      .subject-title {
        font-family: "Royal Enigma", "Cinzel Decorative", "Cinzel", Georgia, serif;
        font-size: clamp(1.9rem, 3.6vw, 2.75rem);
        font-weight: 900;
        background: var(--gold-text-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 12px var(--gold-soft-glow));
        letter-spacing: 1.2px;
        line-height: 1.2;
        animation: fadeInDown 0.4s ease forwards;
      }

      .subject-progress-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 1.05rem;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.14), rgba(212, 175, 55, 0.05));
        border: 1px solid var(--gold-metallic);
        color: var(--gold-primary);
        font-weight: 800;
        font-size: 0.95rem;
        box-shadow: 0 0 14px var(--gold-soft-glow);
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
        gap: 1.35rem;
      }

      .chapter-card {
        background-color: var(--surface-color);
        border: 1px solid var(--surface-border);
        border-radius: 13px;
        padding: 1.35rem 1.45rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        animation: fadeInUp 0.4s ease forwards;
        opacity: 0;
        transform: translateY(14px);
        transition:
          background-color 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          transform 0.22s ease;
      }

      .chapter-card:hover {
        background-color: var(--card-hover);
        border-color: var(--gold-primary);
        box-shadow:
          0 6px 18px rgba(0, 0, 0, 0.28),
          0 0 18px var(--gold-soft-glow);
        transform: translateY(-3px);
      }

      .chapter-card.completed {
        background: var(--card-completed-bg);
        border-color: var(--gold-primary);
        box-shadow:
          0 0 22px var(--gold-glow),
          inset 0 0 12px rgba(255, 215, 0, 0.12);
      }

      .chapter-info {

                currentView = "section";
                currentSectionId = foundSec.id;
                currentSubject = foundSec.subjects.includes(parsed.subject)
                  ? parsed.subject
                  : foundSec.subjects[0];
                return;
              }
            }
          } catch (e) {
            // fallback to home
          }
        }
        currentView = "home";
      }

      function normalizeComputerProgress() {
        // Ensure seamless compatibility between legacy "Computer" key and "Computer Aptitude"
        if (
          userProgress["Computer"] &&
          !userProgress["Computer Aptitude"]
        ) {
          userProgress["Computer Aptitude"] = { ...userProgress["Computer"] };
        } else if (
          userProgress["Computer Aptitude"] &&
          !userProgress["Computer"]
        ) {
          userProgress["Computer"] = { ...userProgress["Computer Aptitude"] };
        }
      }

      function getSubjectStats(subject) {
        const chapters = syllabusData[subject] || [];
        const total = chapters.length;
        let completed = 0;
        const subjProg = userProgress[subject] || {};
        for (let i = 0; i < total; i++) {
          if (subjProg[i]) completed++;
        }
        return { completed, total };
      }

      function getSectionStats(section) {
        let completed = 0;
        let total = 0;
        section.subjects.forEach((subj) => {
          const st = getSubjectStats(subj);
          completed += st.completed;
          total += st.total;
        });
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        return { completed, total, percent };
      }

      function renderSectionsGrid() {
        const grid = document.getElementById("sectionsGrid");
        grid.innerHTML = "";

        sectionsConfig.forEach((section, idx) => {
          const stats = getSectionStats(section);
          const card = document.createElement("div");
          card.className = "section-card";
          card.style.animationDelay = `${idx * 0.06}s`;
          card.onclick = () => window.openSection(section.id);

          const pillsHtml = section.subjects
            .map((s) => `<span class="subject-pill">${s}</span>`)
            .join("");

          card.innerHTML = `
            <div>
              <div class="section-card-top">
                <span class="section-badge">${section.number}</span>
                <div class="section-icon-box">${section.icon}</div>
              </div>
              <h3 class="section-card-title">${section.title}</h3>
            </div>
            <div class="section-subjects-pills">
              ${pillsHtml}
            </div>
            <div class="section-card-footer">
              <div class="section-stats-row">
                <span>${stats.completed} / ${stats.total} Chapters (${stats.percent}%)</span>
                <span class="section-open-cta">Open Section &rarr;</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width: ${stats.percent}%"></div>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });
      }

      window.openHomeView = function () {
        currentView = "home";
        saveNavigationState();
        safeSetStorage(STORAGE_SCROLL_KEY, "0");

        document.getElementById("sectionNavBar").style.display = "none";
        document.getElementById("tabsWrapper").style.display = "none";
        document.getElementById("subjectChaptersView").style.display = "none";
        document.getElementById("homeSectionsView").style.display = "block";

        renderSectionsGrid();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      window.openSection = function (sectionId, specificSubject = null, preserveScroll = false) {
        const section = sectionsConfig.find((s) => s.id === sectionId);
        if (!section) return;

        currentView = "section";
        currentSectionId = section.id;
        currentSubject =
          specificSubject && section.subjects.includes(specificSubject)
            ? specificSubject
            : section.subjects[0];

        saveNavigationState();

        document.getElementById("homeSectionsView").style.display = "none";
        document.getElementById("sectionNavBar").style.display = "flex";
        document.getElementById("tabsWrapper").style.display =
          section.subjects.length > 1 ? "block" : "none";
        document.getElementById("subjectChaptersView").style.display = "block";

        document.getElementById("activeSectionName").textContent = section.title;

        renderSectionTabs(section);
        window.switchSubject(currentSubject, preserveScroll);
      };

      function renderSectionTabs(section) {
        const container = document.getElementById("tabsContainer");
        container.innerHTML = "";

        section.subjects.forEach((subject) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab-btn";
          btn.dataset.subject = subject;
          btn.textContent = subject;
          btn.onclick = () => window.switchSubject(subject, false);
          container.appendChild(btn);
        });
      }

      window.switchSubject = function (subject, preserveScroll = false) {
        currentSubject = subject;
        saveNavigationState();

        document.getElementById("activeSubjectCrumb").textContent = subject;

        document
          .querySelectorAll("#tabsContainer .tab-btn")
          .forEach((btn) => {
            if (btn.dataset.subject === subject) {
              btn.classList.add("active");
              btn.scrollIntoView({
                behavior: "smooth",
                block: "nearest",
                inline: "center",
              });
            } else {
              btn.classList.remove("active");
            }
          });

        document.getElementById("currentSubjectTitle").textContent = subject;
        renderChapters();

        if (!preserveScroll) {
          safeSetStorage(STORAGE_SCROLL_KEY, "0");
        }
      };

      function updateSubjectProgressHeader() {
        const pill = document.getElementById("subjectProgressPill");
        if (!pill) return;
        const stats = getSubjectStats(currentSubject);
        const pct = stats.total > 0 ? Math.round((stats.completed / stats.total) * 100) : 0;
        pill.textContent = `${stats.completed} / ${stats.total} Completed (${pct}%)`;
      }

      function renderChapters() {
        const grid = document.getElementById("chaptersGrid");
        grid.innerHTML = "";

        const chapters = syllabusData[currentSubject];
        if (!chapters) return;

        updateSubjectProgressHeader();

        chapters.forEach((chapter, index) => {
          const isChecked =
            userProgress[currentSubject] && userProgress[currentSubject][index]
              ? true
              : false;

          const card = document.createElement("div");
          card.className = `chapter-card ${isChecked ? "completed" : ""}`;
          card.style.animationDelay = `${Math.min(index * 0.02, 0.4)}s`;
          card.onclick = (e) =>
            window.toggleChapter(e, currentSubject, index, card);

          card.innerHTML = `
            <div class="chapter-info">
              <span class="serial-number">${String(index + 1).padStart(2, "0")}.</span>
              <span class="chapter-name">${chapter}</span>
            </div>
            <label class="checkbox-wrapper" onclick="event.stopPropagation()">
              <input type="checkbox" id="chk-${currentSubject}-${index}" ${isChecked ? "checked" : ""} onchange="window.toggleChapterCheckbox('${currentSubject}', ${index}, this, this.closest('.chapter-card'))">
              <span class="checkmark"></span>
            </label>
          `;

          grid.appendChild(card);
        });
      }

      window.toggleChapter = function (e, subject, index, cardElement) {
        if (e.target.tagName.toLowerCase() === "input") return;

        const checkbox = cardElement.querySelector("input");
        checkbox.checked = !checkbox.checked;
        handleStateChange(subject, index, checkbox.checked, cardElement);
      };

      window.toggleChapterCheckbox = function (
        subject,
        index,
        checkboxElement,
        cardElement,
      ) {
        handleStateChange(subject, index, checkboxElement.checked, cardElement);
      };

      async function handleStateChange(
        subject,
        index,
        isCompleted,
        cardElement,
      ) {
        if (isCompleted) {
          cardElement.classList.add("completed");
        } else {
          cardElement.classList.remove("completed");
        }

        if (!userProgress[subject]) userProgress[subject] = {};
        userProgress[subject][index] = isCompleted;

        if (subject === "Computer Aptitude") {
          if (!userProgress["Computer"]) userProgress["Computer"] = {};
          userProgress["Computer"][index] = isCompleted;
        }

        updateSubjectProgressHeader();

        if (currentUser) {
          const chapterName = syllabusData[subject][index];
          const actionText = isCompleted
            ? `Checked: ${chapterName} in ${subject}`
            : `Unchecked: ${chapterName} in ${subject}`;

          await supabase.from("site_logs").insert([{ action: actionText }]);

          await supabase.from("user_progress").upsert({
            user_id: currentUser.id,
            progress_data: userProgress,
          });
        }
      }

      window.toggleTheme = function () {
        const html = document.documentElement;
        const currentTheme = html.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", newTheme);
        safeSetStorage(STORAGE_THEME_KEY, newTheme);
        updateThemeIcons();
      };

      function updateThemeIcons() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const sunIcon = document.getElementById("sunIcon");
        const moonIcon = document.getElementById("moonIcon");

        if (currentTheme === "dark") {
          sunIcon.style.display = "block";
          moonIcon.style.display = "none";
        } else {
          sunIcon.style.display = "none";
          moonIcon.style.display = "block";
        }
      }

      window.toggleAuth = async function () {
        if (currentUser) {
          const { error } = await supabase.auth.signOut();
          if (!error) {
            currentUser = null;
            document.getElementById("authBtn").textContent =
              "Sign In with GitHub";
            userProgress = {};
            if (currentView === "home") {
              renderSectionsGrid();
            } else {
              renderChapters();
            }
          }
        } else {
          await supabase.auth.signInWithOAuth({
            provider: "github",
            options: {
              redirectTo: window.location.origin + window.location.pathname,
            },
          });
        }
      };

      async function loadUserData(userId) {
        const { data } = await supabase
          .from("user_progress")
          .select("progress_data")
          .eq("user_id", userId)
          .single();

        if (data && data.progress_data) {
          userProgress = data.progress_data;
          normalizeComputerProgress();
          if (currentView === "home") {
            renderSectionsGrid();
          } else {
            renderChapters();
          }
        }
      }

      async function checkSession() {
        supabase.auth.onAuthStateChange(async (event, currentSession) => {
          if (currentSession) {
            currentUser = currentSession.user;
            document.getElementById("authBtn").textContent = "Sign Out";
            await loadUserData(currentUser.id);
          } else {
            currentUser = null;
            document.getElementById("authBtn").textContent =
              "Sign In with GitHub";
            userProgress = {};
            if (currentView === "home") {
              renderSectionsGrid();
            } else {
              renderChapters();
            }
          }
        });
      }

      // Persist scroll position so refreshing stays in the exact same region
      let scrollTicking = false;
      window.addEventListener(
        "scroll",
        () => {
          if (!scrollTicking) {
            window.requestAnimationFrame(() => {
              safeSetStorage(STORAGE_SCROLL_KEY, String(window.scrollY || 0));
              scrollTicking = false;
            });
            scrollTicking = true;
          }
        },
        { passive: true },
      );

      window.onload = () => {
        const savedTheme = safeGetStorage(STORAGE_THEME_KEY);
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
        updateThemeIcons();

        const savedScrollY = parseInt(safeGetStorage(STORAGE_SCROLL_KEY) || "0", 10);
        restoreNavigationState();

        if (currentView === "section") {
          window.openSection(currentSectionId, currentSubject, true);
        } else {
          renderSectionsGrid();
        }

        if (!isNaN(savedScrollY) && savedScrollY > 0) {
          setTimeout(() => {
            window.scrollTo(0, savedScrollY);
          }, 60);
        }

        // Remove intro overlay from DOM after animation finishes (2.7s)
        setTimeout(() => {
          const intro = document.getElementById("introOverlay");
          if (intro) intro.style.display = "none";
        }, 2700);

        checkSession();
      };
    </script>
  </body>
</html>
