    <style>
      :root {
        --bg-color: #0f0f13;
        --surface-color: #1a1a24;
        --surface-border: #2d2d3d;
        --text-primary: #ffffff;
        --text-secondary: #a0a0b5;
        --gold-primary: #ffea00;
        --gold-glow: rgba(255, 234, 0, 0.5);
        --silver-secondary: #c0c0c0;
        --silver-glow: rgba(192, 192, 192, 0.3);
        --header-bg: rgba(15, 15, 19, 0.9);
        --card-hover: #222230;
      }

      [data-theme="light"] {
        --bg-color: #f4f4f8;
        --surface-color: #ffffff;
        --surface-border: #e0e0e0;
        --text-primary: #121212;
        --text-secondary: #555555;
        --gold-primary: #ffb300;
        --gold-glow: rgba(255, 179, 0, 0.4);
        --silver-secondary: #808080;
        --silver-glow: rgba(128, 128, 128, 0.2);
        --header-bg: rgba(244, 244, 248, 0.9);
        --card-hover: #fcfcfc;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Calibri", "Arial", "Verdana", sans-serif;
        transition:
          background-color 0.3s ease,
          color 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background-color: var(--header-bg);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--surface-border);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand h1 {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--gold-primary);
        text-shadow: 0 0 10px var(--gold-glow);
        letter-spacing: 1px;
      }

      .controls {
        display: flex;
        gap: 1rem;
        align-items: center;
        position: relative;
      }

      #authError {
        position: absolute;
        top: 50px;
        right: 0;
        background-color: #ff3333;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-size: 0.8rem;
        display: none;
        white-space: nowrap;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      button {
        cursor: pointer;
        border: none;
        outline: none;
        border-radius: 8px;
        padding: 0.6rem 1.2rem;
        font-weight: bold;
        font-size: 0.9rem;
      }

      .btn-auth {
        background-color: transparent;
        color: var(--silver-secondary);
        border: 1px solid var(--silver-secondary);
        box-shadow: 0 0 5px var(--silver-glow);
      }

      .btn-auth:hover {
        background-color: var(--silver-secondary);
        color: var(--bg-color);
        box-shadow: 0 0 15px var(--silver-glow);
      }

      .btn-theme {
        background-color: var(--surface-color);
        color: var(--text-primary);
        border: 1px solid var(--surface-border);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 50%;
      }

      .btn-theme:hover {
        border-color: var(--gold-primary);
        box-shadow: 0 0 10px var(--gold-glow);
      }

      .tabs-wrapper {
        width: 100%;
        background-color: var(--surface-color);
        border-bottom: 1px solid var(--surface-border);
        padding: 0 1rem;
      }

      .odisha-wrapper {
        background-color: var(--bg-color);
        border-bottom: 1px solid var(--surface-border);
      }

      .tabs-container {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        gap: 1rem;
        padding: 10px 0;
      }

      .tabs-container::-webkit-scrollbar {
        display: none;
      }

      .tab-btn {
        background: transparent;
        color: var(--text-secondary);
        white-space: nowrap;
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        font-size: 1rem;
        border: 1px solid transparent;
      }

      .odisha-wrapper .tab-btn {
        font-size: 0.9rem;
        padding: 0.6rem 1.2rem;
      }

      .tab-btn:hover {
        color: var(--text-primary);
        background-color: var(--card-hover);
      }

      .tab-btn.active {
        color: var(--gold-primary);
        background-color: var(--bg-color);
        border: 1px solid var(--gold-primary);
        box-shadow:
          inset 0 0 12px var(--gold-glow),
          0 0 12px var(--gold-glow);
        text-shadow: 0 0 8px var(--gold-glow);
      }

      main {
        padding: 2rem;
        max-width: 1400px;
        margin: 0 auto;
        min-height: 70vh;
      }

      .subject-title {
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
        color: var(--silver-secondary);
        text-shadow: 0 0 8px var(--silver-glow);
        animation: fadeInDown 0.5s ease forwards;
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
      }

      .chapter-card {
        background-color: var(--surface-color);
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        padding: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        animation: fadeInUp 0.5s ease forwards;
        opacity: 0;
        transform: translateY(20px);
      }

      .chapter-card:hover {
        background-color: var(--card-hover);
        border-color: var(--silver-secondary);
        box-shadow: 0 5px 15px var(--silver-glow);
        transform: translateY(-2px);
      }

      .chapter-card.completed {
        border-color: var(--gold-primary);
        box-shadow: 0 0 18px var(--gold-glow);
      }

      .chapter-info {
        display: flex;
        align-items: flex-start;
        gap: 1rem;
        flex: 1;
      }

      .serial-number {
        font-weight: bold;
        color: var(--silver-secondary);
        font-size: 1.2rem;
        min-width: 30px;
      }

      .chapter-card.completed .serial-number {
        color: var(--gold-primary);
      }

      .chapter-name {
        font-size: 1.1rem;
        line-height: 1.4;
      }

      .checkbox-wrapper {
        position: relative;
        width: 28px;
        height: 28px;
        flex-shrink: 0;
      }

      .checkbox-wrapper input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }

      .checkmark {
        position: absolute;
        top: 0;
        left: 0;
        height: 28px;
        width: 28px;
        background-color: transparent;
        border: 2px solid var(--surface-border);
        border-radius: 6px;
        transition: all 0.3s ease;
      }

      .chapter-card:hover .checkmark {
        border-color: var(--silver-secondary);
      }

      .checkbox-wrapper input:checked ~ .checkmark {
        background-color: var(--gold-primary);
        border-color: var(--gold-primary);
        box-shadow: 0 0 15px var(--gold-glow);
      }

      .checkmark:after {
        content: "";
        position: absolute;
        display: none;
        left: 9px;
        top: 4px;
        width: 6px;
        height: 12px;
        border: solid var(--bg-color);
        border-width: 0 3px 3px 0;
        transform: rotate(45deg);
      }

      .checkbox-wrapper input:checked ~ .checkmark:after {
        display: block;
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        header {
          flex-direction: column;
          gap: 1rem;
          padding: 1rem;
        }
        .grid-container {
          grid-template-columns: 1fr;
        }
        main {
          padding: 1.5rem 1rem;
        }
      }
    </style>

          btn.className = "tab-btn";
          btn.textContent = subject;
          btn.onclick = () => window.switchSubject(subject, false);
          container.appendChild(btn);
        });

        const odishaMainBtn = document.createElement("button");
        odishaMainBtn.type = "button";
        odishaMainBtn.className = "tab-btn";
        odishaMainBtn.id = "odishaMainTabBtn";
        odishaMainBtn.textContent = "Odisha Specifics";
        odishaMainBtn.onclick = () =>
          window.switchSubject(odishaSubjectsList[0], true);
        container.appendChild(odishaMainBtn);

        const odishaContainer = document.getElementById("odishaTabsContainer");
        odishaContainer.innerHTML = "";

        odishaSubjectsList.forEach((subject) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab-btn";
          btn.textContent = subject;
          btn.onclick = () => window.switchSubject(subject, true);
          odishaContainer.appendChild(btn);
        });
      }

      function renderChapters() {
        const grid = document.getElementById("chaptersGrid");
        grid.innerHTML = "";

        const chapters = syllabusData[currentSubject];

        if (!chapters) return;

        chapters.forEach((chapter, index) => {
          const isChecked =
            userProgress[currentSubject] && userProgress[currentSubject][index]
              ? true
              : false;

          const card = document.createElement("div");
          card.className = `chapter-card ${isChecked ? "completed" : ""}`;
          card.style.animationDelay = `${index * 0.03}s`;
          card.onclick = (e) =>
            window.toggleChapter(e, currentSubject, index, card);

          card.innerHTML = `
                    <div class="chapter-info">
                        <span class="serial-number">${String(index + 1).padStart(2, "0")}.</span>
                        <span class="chapter-name">${chapter}</span>
                    </div>
                    <label class="checkbox-wrapper" onclick="event.stopPropagation()">
                        <input type="checkbox" id="chk-${currentSubject}-${index}" ${isChecked ? "checked" : ""} onchange="window.toggleChapterCheckbox('${currentSubject}', ${index}, this, this.closest('.chapter-card'))">
                        <span class="checkmark"></span>
                    </label>
                `;

          grid.appendChild(card);
        });
      }

      window.toggleChapter = function (e, subject, index, cardElement) {
        if (e.target.tagName.toLowerCase() === "input") return;

        const checkbox = cardElement.querySelector("input");
        checkbox.checked = !checkbox.checked;
        handleStateChange(subject, index, checkbox.checked, cardElement);
      };

      window.toggleChapterCheckbox = function (
        subject,
        index,
        checkboxElement,
        cardElement,
      ) {
        handleStateChange(subject, index, checkboxElement.checked, cardElement);
      };

      async function handleStateChange(
        subject,
        index,
        isCompleted,
        cardElement,
      ) {
        if (isCompleted) {
          cardElement.classList.add("completed");
        } else {
          cardElement.classList.remove("completed");
        }

        if (!userProgress[subject]) userProgress[subject] = {};
        userProgress[subject][index] = isCompleted;

        // localStorage saving completely removed to rely on Supabase

        if (currentUser) {
          const chapterName = syllabusData[subject][index];
          const actionText = isCompleted
            ? `Checked: ${chapterName} in ${subject}`
            : `Unchecked: ${chapterName} in ${subject}`;

          await supabase.from("site_logs").insert([{ action: actionText }]);

          await supabase.from("user_progress").upsert({
            user_id: currentUser.id,
            progress_data: userProgress,
          });
        }
      }

      window.toggleTheme = function () {
        const html = document.documentElement;
        const currentTheme = html.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", newTheme);
        updateThemeIcons();
      };

      function updateThemeIcons() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const sunIcon = document.getElementById("sunIcon");
        const moonIcon = document.getElementById("moonIcon");

        if (currentTheme === "dark") {
          sunIcon.style.display = "block";
          moonIcon.style.display = "none";
        } else {
          sunIcon.style.display = "none";
          moonIcon.style.display = "block";
        }
      }

      window.toggleAuth = async function () {
        if (currentUser) {
          const { error } = await supabase.auth.signOut();
          if (!error) {
            currentUser = null;
            document.getElementById("authBtn").textContent =
              "Sign In with GitHub";
            userProgress = {};
            // localStorage clearing completely removed
            renderChapters();
          }
        } else {
          await supabase.auth.signInWithOAuth({
            provider: "github",
            options: {
              redirectTo: window.location.origin + window.location.pathname,
            },
          });
        }
      };

      async function loadUserData(userId) {
        const { data, error } = await supabase
          .from("user_progress")
          .select("progress_data")
          .eq("user_id", userId)
          .single();

        if (data && data.progress_data) {
          userProgress = data.progress_data;
          // localStorage populating completely removed
          renderChapters();
        }
      }

      async function checkSession() {
        supabase.auth.onAuthStateChange(async (event, currentSession) => {
          if (currentSession) {
            currentUser = currentSession.user;
            document.getElementById("authBtn").textContent = "Sign Out";
            await loadUserData(currentUser.id);
          } else {
            currentUser = null;
            document.getElementById("authBtn").textContent =
              "Sign In with GitHub";
            userProgress = {};
            // localStorage clearing completely removed
            renderChapters();
          }
        });
      }

      window.onload = () => {
        renderTabs();
        window.switchSubject(currentSubject, false);
        updateThemeIcons();
        checkSession();
      };
    </script>
  </body>
</html>
